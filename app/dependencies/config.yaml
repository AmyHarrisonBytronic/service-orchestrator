system_details:
  - platform: windows
    git_owner: AmyHarrisonBytronic
    broker_details:
      mqtt_ip: "localhost"
      mqtt_port: 1883
      topics: 
      - name: "receive_update_command"
        topic: "test/image/update"
        is_subscribe: True
        is_trigger: True
      
      - name: "reveive_shutdown_command"
        topic: "test/hmi/update"
        is_subscribe: True
        is_trigger: True

services:
  - service_directory: "https://github.com/AmyHarrisonBytronic/camera-service"
    repository_name: "camera-service"
    service_id: "camera_service"
    config_details:
      mqtt:
        ip: "localhost"
        port: 1883
        trigger_topic: "magnapower/hmi/instruction"
        image_topic: "magnapower/image/colour_image"
        trigger_time_topic: "magnapower/image/trigger_time"
        message: null

      camera:
        camera_type: dummy
        camera_id: "0001"
        pixel_format: BayerRG8
        trigger_type: software
        dummy_location: "C:/Users/AmyHarrison/camera_worker/camera-worker/test/"
        file_type: ".png"
        capture_timout: 10

      archiving:
        is_archived: true
        archive_directory: "save_dir"
        archive_params:
          archive_freq: "daily"
          archive_storage: 50
          archive_days: 30

  - service_directory: "https://github.com/Bytronic-Vision-Intelligence/inference-service"
    repository_name: "camera-service"
    service_id: "inference_service"
    config_details:

  - service_directory: "https://github.com/Bytronic-Vision-Intelligence/dio-service"
    repository_name: "camera-service"
    service_id: "dio_service"
    config_details:
